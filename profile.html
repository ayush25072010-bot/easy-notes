<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Easy Notes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f6f8fc;
      padding: 25px 15px;
    }

    .profile-box {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #315bea;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .email {
      color: #667085;
      margin-bottom: 25px;
      word-break: break-word;
    }

    .info {
      text-align: left;
      background: #f6f8fc;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .info p {
      margin: 9px 0;
    }

    .logout-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e53935;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      margin-top: 18px;
      color: #315bea;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="profile-box">

    <div class="avatar">👤</div>

    <h1 id="userName">My Profile</h1>

    <p class="email" id="userEmail">
      Loading...
    </p>

    <div class="info">
      <p><strong>Account:</strong> Student</p>
      <p><strong>Platform:</strong> Easy Notes</p>
    </div>

    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>

    <a class="back" href="index.html">
      ← Back to Easy Notes
    </a>

  </div>

</body>
</html>
